
name: HGhub Android ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm tauri android init --ci

      - name: Build ARM64 APK
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/HGhub-ARM64-debug.apk \;
          test -s artifacts/HGhub-ARM64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-ARM64
          path: artifacts/*.apk
          if-no-files-found: error
